services:
  node_app:
    container_name: node_app
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm start"
    volumes:
      - ./app:/app
    ports:
      - 9000:3000
    depends_on:
      - redis_db
  
  redis_db:
    container_name: redis_db
    image: redis:alpine3.16
    ports:
      - 6379:6379